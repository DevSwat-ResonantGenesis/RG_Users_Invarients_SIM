# Standalone docker-compose snippet for RG Users Invariants SIM
# Merge into main docker-compose.unified.yml or use standalone

services:
  rg_users_invarients_sim:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rg_users_invarients_sim
    env_file:
      - .env.production
    environment:
      REDIS_URL: redis://shared_redis:6379/0
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  app-network:
    external: true
